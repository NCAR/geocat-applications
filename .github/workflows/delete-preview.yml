name: delete-preview

on:
  pull_request_target:
    types: [closed]

jobs:
  delete:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages

      - name: Delete preview files
        run: |
          rm -rf _preview/${{ github.event.pull_request.number }}

      - name: Commit the changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: gh-pages
          commit_message: "Delete preview for pull request #${{ github.event.pull_request.number }}"
